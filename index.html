<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Drawing Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Welcome to the drawing prompt generator</h1>
      </header>

      <main>
        <div class="form-container">
          <form id="drawing-generator-form">
            <input
              type="text"
              placeholder="Enter the topic of the drawing you'd like"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="submit-button" />
          </form>
          <div class="hint">i. e.: Flower, Horse, Magic, Fairy</div>
        </div>
        <div class="prompt hidden" id="prompt"></div>
      </main>

      <footer>
        <p>
          This AI project was coded with 💖 by
          <a href="https://github.com/pauggza" target="_blank">Paulina</a> and
          is
          <a
            href="https://github.com/pauggza/drawing-prompt-generator"
            target="_blank"
          >
            on GitHub</a
          >
          and
          <a
            href="https://drawing-prompt-generator.onrender.com"
            target="_blank"
            >hosted on Render</a
          >
        </p>
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
